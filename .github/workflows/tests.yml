name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: football_stats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://football:ci-password@localhost:5432/football_stats_test
      TEST_DATABASE_URL: postgresql+psycopg://football:ci-password@localhost:5432/football_stats_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Check models and migrations match
        run: alembic check

      - name: Run tests
        run: pytest -v
